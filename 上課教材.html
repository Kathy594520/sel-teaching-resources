<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEL 上課教材｜20 節情境故事</title>
<style>
:root{--paper:#faf9f5;--ink:#111;--green:#b6ff00;--coral:#ff6d4d;--blue:#dff2ff;--muted:#6c6868}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei",sans-serif}.top{padding:16px 5vw;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;font-weight:900}.tag{background:var(--green);border:2px solid var(--ink);padding:7px;font:700 11px Consolas,monospace}main{max-width:1240px;margin:auto;padding:42px 5vw 80px}.back{color:var(--ink);font-weight:900;text-decoration:none}.eyebrow{font:700 12px Consolas,monospace;color:var(--muted);letter-spacing:.12em}h1{font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-.07em;margin:26px 0 14px;color:var(--coral)}.lede{max-width:760px;font-size:19px;line-height:1.8;margin-bottom:42px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.lesson-card{border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink);background:#fff;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;overflow:hidden}.thumb{aspect-ratio:4/3;background:linear-gradient(135deg,var(--blue),#fff);display:grid;place-items:center;overflow:hidden;border-bottom:2px solid var(--ink);padding:18px;text-align:center}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.card-body{padding:17px}.step{font:700 12px Consolas,monospace;color:var(--muted)}h2{font-size:22px;line-height:1.25;margin:8px 0 0}.detail{display:none;border-top:2px solid var(--ink);margin-top:60px;padding-top:28px}.detail.active{display:block}.detail-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.detail h2{font-size:clamp(30px,4vw,52px);margin:8px 0}.detail-image{background:#fff;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:10px;max-width:1000px;margin:0 auto 28px}.detail-image img{width:100%;max-height:70vh;object-fit:contain;display:block}.actions{display:flex;flex-wrap:wrap;gap:12px}.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:13px 17px;font-weight:900}.btn.secondary{background:var(--green);color:var(--ink)}.hint{margin-top:26px;background:var(--ink);color:#fff;padding:20px;line-height:1.8}.hint strong{color:var(--green)}footer{margin-top:60px;border-top:2px solid var(--ink);padding-top:18px;color:var(--muted);font:11px Consolas,monospace}@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){main{padding:30px 4vw 60px}.grid{grid-template-columns:repeat(2,1fr);gap:16px}.detail-head{display:block}.thumb{aspect-ratio:1/1}}
</style>
</head>
<body>
<header class="top"><div>SEL 上課教材</div><div class="tag">20 LESSONS / STORY VISUALS</div></header>
<main><a class="back" href="index.html">← 回到備課首頁</a><div class="eyebrow" style="margin-top:34px">ELEMENTARY SEL · CLASSROOM MATERIALS</div><h1>先看故事，<br>再進入教材。</h1><p class="lede">選擇一課，先用情境圖片引起注意，再開啟對應的 PPTX 內容。</p><section class="grid" id="lesson-grid"></section><section class="detail" id="detail" aria-live="polite"><div class="detail-head"><div><div class="eyebrow" id="detail-step"></div><h2 id="detail-title"></h2></div><a class="back" href="#lesson-grid">← 回到課程圖示</a></div><div class="detail-image" id="detail-image"><img id="detail-img" alt=""></div><div class="actions"><a class="btn" id="pptx-link" target="_blank" rel="noopener">開啟本課 PPTX ↗</a><a class="btn secondary" id="download-link" download>下載本課 PPTX ↓</a></div><div class="hint"><strong>上課建議</strong><br>先放大觀看情境圖片，再開啟 PPTX 進行課程活動。</div></section><footer>SEL TEACHER TOOLKIT · 仙姑凱西設計</footer></main>
<script>
const titles=['情緒不是故障','生理期與身體照顧','情緒來了，我有方法','我可以求助','我的身心照顧卡','朋友不必完全一樣','界線與尊重','衝突可以被處理','團體中的我','我的人際情境回應卡','看到的，不一定是真的','個資與影像界線','留言前先想三秒','我的數位平衡','我的網路與資訊素養檢核站','壓力在告訴我什麼','把大壓力拆成小步驟','比較、失敗與自我價值','我的壓力導航圖','我的下一站行動方案'];
const lessons=titles.map((title,i)=>[String(i+1).padStart(2,'0'),title,`assets/sel-story-images/STEP-${String(i+1).padStart(2,'0')}.png`]);
const pptx='pptx/SEL教學手冊_情境圖片_頁次修正版.pptx';const grid=document.querySelector('#lesson-grid');grid.innerHTML=lessons.map((x,i)=>`<a class="lesson-card" href="#lesson-${i+1}"><div class="thumb"><img src="${x[2]}" alt="STEP ${x[0]} ${x[1]}" loading="lazy"></div><div class="card-body"><div class="step">STEP ${x[0]}</div><h2>${x[1]}</h2></div></a>`).join('');
function show(i){const x=lessons[i];if(!x)return;const d=document.querySelector('#detail'),img=document.querySelector('#detail-img');document.querySelector('#detail-step').textContent=`STEP ${x[0]}`;document.querySelector('#detail-title').textContent=x[1];img.src=x[2];img.alt=`STEP ${x[0]} ${x[1]} 情境圖片`;document.querySelector('#pptx-link').href=pptx;document.querySelector('#download-link').href=pptx;d.classList.add('active');d.scrollIntoView({behavior:'smooth'});}function route(){const m=location.hash.match(/^#lesson-(\d+)$/);if(m)show(Number(m[1])-1);else document.querySelector('#detail').classList.remove('active')}addEventListener('hashchange',route);route();
</script>
</body></html>
